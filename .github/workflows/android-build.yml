name: Android build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/book-text-cleaner

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Russian text and app unit tests
        run: ./gradlew testFullDebugUnitTest --no-daemon

      - name: Build full Android APK
        run: ./gradlew assembleFullDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RuVoice-Enhanced-full-debug
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14
