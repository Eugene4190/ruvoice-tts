name: Android build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/book-text-cleaner

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install NDK r28c and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "ndk;28.2.13676358" "cmake;3.31.6" "platforms;android-35"
          echo "$ANDROID_HOME/cmake/3.31.6/bin" >> "$GITHUB_PATH"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install ExecuTorch host package
        run: python -m pip install --upgrade pip executorch==1.5.0

      - name: Build device-compatible ExecuTorch AAR
        env:
          PYTHON_EXECUTABLE: ${{ env.pythonLocation }}/bin/python
        run: tools/build_executorch_aar.sh "$RUNNER_TEMP/executorch-aar-build"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Russian text and app unit tests
        run: ./gradlew testFullDebugUnitTest --no-daemon

      - name: Build full Android APK
        run: ./gradlew assembleFullDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RuVoice-Enhanced-full-debug
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14
