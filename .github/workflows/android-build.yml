name: Android build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/book-text-cleaner

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install NDK r28c and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "ndk;28.2.13676358" "cmake;3.31.6" "platforms;android-35"
          echo "$ANDROID_HOME/cmake/3.31.6/bin" >> "$GITHUB_PATH"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install ExecuTorch host package
        run: |
          python -m pip install --upgrade pip executorch==1.5.0
          python -m pip install torch==2.14.0 --extra-index-url https://download.pytorch.org/whl/test/cpu

      - name: Download and export the official Silero v5_5_ru voice model
        run: |
          mkdir -p tools
          curl --fail --location --retry 3 --retry-all-errors \
            https://models.silero.ai/models/tts/ru/v5_5_ru.pt \
            --output tools/v5_5_ru.pt
          test "$(stat -c%s tools/v5_5_ru.pt)" -gt 100000000
          cp app/src/main/assets/silero/silero_ru.json "$RUNNER_TEMP/silero_ru.json"
          python tools/export_silero.py
          # export_silero.py writes a minimal upstream JSON; restore RuVoice's enriched dictionaries/rules.
          cp "$RUNNER_TEMP/silero_ru.json" app/src/main/assets/silero/silero_ru.json

      - name: Build device-compatible ExecuTorch AAR
        env:
          PYTHON_EXECUTABLE: ${{ env.pythonLocation }}/bin/python
        run: |
          mkdir -p app/libs
          tools/build_executorch_aar.sh "$RUNNER_TEMP/executorch-aar-build"

      - name: Export and verify the XNNPACK vocoder backbone
        env:
          PYTHON_EXECUTABLE: ${{ env.pythonLocation }}/bin/python
        run: python tools/vocoder_et.py

      - name: Verify all mandatory voice assets before packaging
        run: |
          set -eu
          for f in \
            app/src/main/assets/silero/accentor.ptl \
            app/src/main/assets/silero/homo.ptl \
            app/src/main/assets/silero/silero_ru.json \
            app/src/full/assets/silero/tts_mel.ptl \
            app/src/full/assets/silero/head.ptl \
            app/src/full/assets/silero/backbone.pte \
            app/src/androidTest/assets/golden_audio.f32; do
            test -s "$f" || { echo "Missing required voice asset: $f"; exit 1; }
            echo "$(basename "$f"): $(stat -c%s "$f") bytes"
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Russian text and app unit tests
        run: ./gradlew testFullDebugUnitTest --no-daemon

      - name: Upload unit test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RuVoice-unit-test-diagnostics
          path: app/build/reports/tests/testFullDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build full Android APK
        run: ./gradlew assembleFullDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RuVoice-Enhanced-full-debug
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14
